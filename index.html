<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>极简冥想计时</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
        system-ui, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.18);
      padding: 20px 20px 24px;
    }

    .app-header {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .timer-section {
      padding: 12px 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .timer-disc-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      margin-bottom: 12px;
    }

    .timer-disc {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #222 0%, #050608 60%, #000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .timer-disc::before {
      content: "";
      position: absolute;
      width: 98%;
      height: 98%;
      border-radius: 50%;
      border: 2px solid rgba(148, 163, 184, 0.6);
    }

    .timer-hand {
      position: absolute;
      width: 50%;
      height: 2px;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      transform-origin: 10% 50%;
      left: 50%;
      top: 50%;
      border-radius: 999px;
      transition: transform 0.3s ease-out;
      transform: translate(-50%, -50%) rotate(-90deg);
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
    }

    .timer-inner {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 6px rgba(15, 23, 42, 0.7);
      font-size: 42px;
    }

    .time-display {
      margin-top: 12px;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #111827;
    }

    .time-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      justify-content: center;
    }

    .btn {
      border: none;
      outline: none;
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 14px;
      cursor: pointer;
      background: #f3f4f6;
      color: #111827;
      min-width: 70px;
      text-align: center;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: #e5e7eb;
    }

    .btn-primary {
      background: #22c55e;
      color: #fff;
      padding: 10px 18px;
      font-size: 16px;
      margin-top: 14px;
      min-width: 160px;
      box-shadow: 0 10px 20px rgba(34, 197, 94, 0.35);
    }

    .btn-primary:hover {
      background: #16a34a;
      box-shadow: 0 12px 24px rgba(34, 197, 94, 0.4);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
      box-shadow: 0 6px 14px rgba(34, 197, 94, 0.35);
    }

    .btn-pill {
      border-radius: 1000px;
    }

    .btn-outline {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }

    .btn-outline.active {
      border-color: #22c55e;
      color: #16a34a;
      background: #dcfce7;
    }

    .btn-soft.active {
      background: #22c55e;
      color: #fff;
    }

    .btn-soft {
      background: #f3f4f6;
    }

    .time-presets .btn-soft.active {
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.4);
    }

    .custom-time {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 14px;
      color: #6b7280;
    }

    .custom-time input {
      width: 70px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      padding: 4px 8px;
      text-align: center;
      outline: none;
      font-size: 14px;
    }

    .custom-time input:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.3);
    }

    .sound-section {
      padding-top: 16px;
    }

    .sound-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .sound-grid button {
      padding: 8px 4px;
      font-size: 14px;
    }

    .mode-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
    }

    .footer {
      margin-top: 16px;
      font-size: 12px;
      text-align: center;
      color: #9ca3af;
    }

    @media (max-width: 480px) {
      .app {
        padding: 18px 16px 20px;
      }
      .timer-disc-wrapper {
        width: 200px;
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="app-header">极简冥想计时</div>

    <div class="timer-section">
      <div class="timer-disc-wrapper">
        <div class="timer-disc">
          <div class="timer-hand" id="timerHand"></div>
          <div class="timer-inner">⏳</div>
        </div>
      </div>
      <div class="time-display" id="timeDisplay">03:00</div>

      <div class="time-presets" id="presetButtons">
        <button class="btn btn-soft btn-pill preset active" data-seconds="60">1分钟</button>
        <button class="btn btn-soft btn-pill preset" data-seconds="180">3分钟</button>
        <button class="btn btn-soft btn-pill preset" data-seconds="300">5分钟</button>
        <button class="btn btn-soft btn-pill preset" data-seconds="600">10分钟</button>
        <button class="btn btn-soft btn-pill preset" data-seconds="1800">30分钟</button>
      </div>

      <div class="custom-time">
        <span>自定义：</span>
        <input type="number" id="customMinutes" placeholder="分钟" min="1" />
        <span>（留空则用上面预设）</span>
      </div>

      <button class="btn btn-primary" id="startBtn">开始</button>
    </div>

    <div class="sound-section">
      <div style="margin-bottom:6px; font-size:14px; color:#374151;">环境音</div>
      <div class="sound-grid" id="soundButtons">
        <button class="btn btn-outline btn-pill sound active" data-key="none">无音乐</button>
        <button class="btn btn-outline btn-pill sound" data-key="white">白噪音</button>
        <button class="btn btn-outline btn-pill sound" data-key="valley">山谷</button>
        <button class="btn btn-outline btn-pill sound" data-key="thunder">雷暴</button>
        <button class="btn btn-outline btn-pill sound" data-key="stream">小溪</button>
        <button class="btn btn-outline btn-pill sound" data-key="rain">雨声</button>
        <button class="btn btn-outline btn-pill sound" data-key="ocean">海洋</button>
        <button class="btn btn-outline btn-pill sound" data-key="night">夜晚</button>
        <button class="btn btn-outline btn-pill sound" data-key="forest">森林</button>
      </div>

      <div class="mode-row">
        <button class="btn btn-pill btn-soft active" id="modeLoop">循环</button>
        <button class="btn btn-pill btn-soft" id="modeRandom">随机</button>
      </div>
    </div>

    <div class="footer">
      提示：请自备无版权的环境音文件，放到 <code>sounds/</code> 目录中。
    </div>
  </div>

  <script>
    // ====== 配置你的音频文件路径 ======
    // 把对应的 mp3 放在 /sounds 目录下，文件名自己改即可
    const SOUND_FILES = {
      white: "sounds/white-noise.mp3",
      valley: "sounds/valley.mp3",
      thunder: "sounds/thunderstorm.mp3",
      stream: "sounds/stream.mp3",
      rain: "sounds/rain.mp3",
      ocean: "sounds/ocean.mp3",
      night: "sounds/night.mp3",
      forest: "sounds/forest.mp3"
    };

    const timeDisplay = document.getElementById("timeDisplay");
    const startBtn = document.getElementById("startBtn");
    const presetContainer = document.getElementById("presetButtons");
    const customInput = document.getElementById("customMinutes");
    const soundContainer = document.getElementById("soundButtons");
    const modeLoopBtn = document.getElementById("modeLoop");
    const modeRandomBtn = document.getElementById("modeRandom");
    const timerHand = document.getElementById("timerHand");

    let totalSeconds = 180; // 默认 3 分钟
    let remainingSeconds = totalSeconds;
    let timerId = null;
    let isRunning = false;

    let selectedSoundKey = "none";
    let mode = "loop"; // or 'random'
    let audio = null;

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      const mm = m < 10 ? "0" + m : "" + m;
      const ss = s < 10 ? "0" + s : "" + s;
      return `${mm}:${ss}`;
    }

    function updateDisplay() {
      timeDisplay.textContent = formatTime(remainingSeconds);

      // 进度角度：从 -90 度开始，顺时针 360 度
      const progress = 1 - remainingSeconds / totalSeconds;
      const angle = -90 + progress * 360;
      timerHand.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
    }

    function setTotalSeconds(sec) {
      totalSeconds = sec;
      remainingSeconds = sec;
      updateDisplay();
    }

    function stopAudio() {
      if (audio) {
        audio.pause();
        audio.currentTime = 0;
        audio = null;
      }
    }

    function playSoundOnce(key) {
      if (key === "none") return;

      stopAudio();
      const src = SOUND_FILES[key];
      if (!src) return;
      audio = new Audio(src);
      audio.loop = mode === "loop";

      if (mode === "random") {
        audio.loop = false;
        audio.addEventListener("ended", () => {
          if (remainingSeconds > 0) {
            const keys = Object.keys(SOUND_FILES);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            playSoundOnce(randomKey);
          }
        });
      }

      audio.play().catch(() => {
        console.warn("音频播放失败（浏览器可能需要用户交互）");
      });
    }

    function startTimer() {
      if (isRunning) return;

      // 优先使用自定义时间
      const customMinutes = Number(customInput.value);
      if (customMinutes > 0) {
        setTotalSeconds(customMinutes * 60);
      } else if (remainingSeconds <= 0) {
        // 防止从 0 开始
        remainingSeconds = totalSeconds;
      }

      isRunning = true;
      startBtn.textContent = "停止";
      playSoundOnce(selectedSoundKey);

      const startTotal = remainingSeconds;
      totalSeconds = startTotal; // 让进度环从当前时间开始

      timerId = setInterval(() => {
        remainingSeconds -= 1;
        if (remainingSeconds <= 0) {
          remainingSeconds = 0;
          updateDisplay();
          clearInterval(timerId);
          timerId = null;
          isRunning = false;
          startBtn.textContent = "开始";
          stopAudio();
          alert("时间到啦！");
        } else {
          updateDisplay();
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      isRunning = false;
      startBtn.textContent = "开始";
      stopAudio();
    }

    // 预设时间按钮
    presetContainer.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-seconds]");
      if (!btn || isRunning) return;
      presetContainer
        .querySelectorAll(".preset")
        .forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      const sec = Number(btn.dataset.seconds);
      setTotalSeconds(sec);
      customInput.value = "";
    });

    // 自定义时间变化
    customInput.addEventListener("change", () => {
      if (isRunning) return;
      const minutes = Number(customInput.value);
      if (minutes > 0) {
        setTotalSeconds(minutes * 60);
        presetContainer
          .querySelectorAll(".preset")
          .forEach((b) => b.classList.remove("active"));
      } else {
        customInput.value = "";
      }
    });

    // 声音选择
    soundContainer.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-key]");
      if (!btn) return;
      soundContainer
        .querySelectorAll(".sound")
        .forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      selectedSoundKey = btn.dataset.key;
      if (isRunning) {
        playSoundOnce(selectedSoundKey);
      }
    });

    // 模式切换：循环 / 随机
    modeLoopBtn.addEventListener("click", () => {
      mode = "loop";
      modeLoopBtn.classList.add("active");
      modeRandomBtn.classList.remove("active");
      if (audio) audio.loop = true;
    });

    modeRandomBtn.addEventListener("click", () => {
      mode = "random";
      modeRandomBtn.classList.add("active");
      modeLoopBtn.classList.remove("active");
      if (audio) audio.loop = false;
    });

    // 开始 / 停止按钮
    startBtn.addEventListener("click", () => {
      if (!isRunning) {
        startTimer();
      } else {
        stopTimer();
      }
    });

    // 初始化显示
    setTotalSeconds(180); // 默认 3 分钟
  </script>
</body>
</html>
